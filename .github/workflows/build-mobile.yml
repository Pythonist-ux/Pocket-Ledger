name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default package list includes 'tools', which no longer exists
          # in cmdline-tools 16.0 and makes sdkmanager fail. Install only what
          # this project needs.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.2.0 needs Gradle 8.x; the runner's preinstalled Gradle may be newer.
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-Local-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
