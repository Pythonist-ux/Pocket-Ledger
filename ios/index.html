<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>PocketLedger</title>
<meta name="theme-color" content="#0A0B0F" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PocketLedger" />
<style>
:root {
  --bg: #0A0B0F; --s1: #11131A; --s2: #171A22; --s3: #1F232D;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
  --tx: #F4F6F8; --mut: #8D95A3; --dim: #5D6472;
  --acc: #4BE3A5; --acc2: #22C3E6; --red: #FF6B7A; --amber: #FFB347;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tx); overflow: hidden; overscroll-behavior: none; }
body {
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", Roboto, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
input, textarea { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Splash ---------- */
#splash { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; transition: opacity .35s ease, visibility .35s; }
#splash.hide { opacity: 0; visibility: hidden; }
#splash svg { width: 104px; height: 104px; border-radius: 28px; box-shadow: 0 0 70px rgba(75,227,165,.22); animation: pop .75s cubic-bezier(.2,.9,.3,1.15) both; }
#splash .name { font-size: 21px; font-weight: 600; letter-spacing: .03em; opacity: 0; animation: fade .6s .3s both; }
#splash .name b { background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Layout ---------- */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--sat) + 10px) 14px 8px 8px; }
.period { display: flex; align-items: center; gap: 2px; }
.icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--mut); transition: background .15s, color .15s, opacity .15s; }
.icon:active { background: var(--s2); color: var(--tx); }
.icon[disabled] { opacity: .25; pointer-events: none; }
.plabel { font-size: 17px; font-weight: 650; letter-spacing: -.01em; min-width: 140px; text-align: center; }
.acts { display: flex; gap: 2px; }
#scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 0; scrollbar-width: none; }
#scroll::-webkit-scrollbar { display: none; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 18px 16px; background: linear-gradient(160deg, #161A23 0%, #0F1217 70%); border: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -120px; background: radial-gradient(closest-side, rgba(75,227,165,.20), transparent); pointer-events: none; }
.hero-top { display: flex; align-items: center; justify-content: space-between; position: relative; }
.eyebrow { font-size: 13px; color: var(--mut); font-weight: 500; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.05); }
.seg button { padding: 5px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--mut); transition: background .15s, color .15s; }
.seg button.on { background: var(--s3); color: var(--tx); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
.total { font-size: 44px; font-weight: 700; letter-spacing: -.035em; margin: 10px 0 2px; position: relative; line-height: 1.1; }
.sub { font-size: 13px; color: var(--mut); position: relative; }
.delta { font-weight: 650; }
.delta.up { color: var(--red); } .delta.down { color: var(--acc); }
.bar { display: flex; gap: 3px; height: 10px; margin: 18px 0 14px; position: relative; }
.bar i { display: block; border-radius: 5px; min-width: 6px; }
.crow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 6px; margin: 0 -6px; border-radius: 12px; text-align: left; font-size: 13.5px; position: relative; transition: background .15s; }
.crow:active, .crow.on { background: rgba(255,255,255,.06); }
.crow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.crow .cn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .pc { color: var(--dim); font-size: 12.5px; }
.crow .ca { font-weight: 600; text-align: right; flex: none; }
.crow .pc { flex: none; min-width: 30px; text-align: right; }

/* ---------- Toolbar & list ---------- */
.search { display: flex; align-items: center; gap: 8px; margin: 16px 0 10px; padding: 0 14px; height: 44px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); color: var(--dim); }
.search svg { width: 18px; height: 18px; flex: none; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 15px; color: var(--tx); }
.search input::placeholder { color: var(--dim); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; padding-bottom: 2px; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 550; color: var(--mut); background: var(--s1); border: 1px solid var(--line); white-space: nowrap; transition: all .15s; }
.chip.on { color: #04140D; background: var(--acc); border-color: var(--acc); }
.chip.add { color: var(--acc); border-style: dashed; border-color: rgba(75,227,165,.4); background: transparent; }
.day { font-size: 12.5px; font-weight: 650; color: var(--dim); letter-spacing: .04em; text-transform: uppercase; margin: 14px 4px 6px; display: flex; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 13px; width: 100%; padding: 11px 6px; margin: 0 -6px; border-radius: 16px; text-align: left; transition: background .15s; animation: fade .3s both; }
.row:active { background: var(--s1); }
.av { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 17px; flex: none; }
.mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mn { font-weight: 600; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms { font-size: 12.5px; color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rt { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.auto { font-style: normal; font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; color: var(--acc); background: rgba(75,227,165,.12); }
.note { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-weight: 650; font-size: 15.5px; flex: none; }
.empty { text-align: center; padding: 44px 24px; color: var(--mut); }
.empty .big { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 20px; display: grid; place-items: center; background: var(--s1); color: var(--acc); border: 1px solid var(--line); }
.empty b { display: block; color: var(--tx); font-size: 17px; margin-bottom: 4px; }

#fab { position: fixed; right: 20px; bottom: calc(var(--sab) + 22px); width: 62px; height: 62px; border-radius: 22px; display: grid; place-items: center; color: #04140D; background: linear-gradient(135deg, #6BF5B8, #2FDDA0 55%, #22C3E6); box-shadow: 0 10px 30px rgba(47,221,160,.35), 0 0 0 1px rgba(255,255,255,.12) inset; transition: transform .15s; z-index: 5; }
#fab:active { transform: scale(.92); }
#fab svg { width: 28px; height: 28px; stroke-width: 2.4; }

/* ---------- Sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; visibility: hidden; }
.sheet-wrap.open { visibility: visible; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; }
.sheet-wrap.open .backdrop { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column; background: var(--s1); border-radius: 28px 28px 0 0; border-top: 1px solid var(--line2); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); padding-bottom: var(--sab); }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 38px; height: 4px; border-radius: 2px; background: var(--s3); margin: 9px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 4px 22px; flex: none; }
.sheet-head h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.sheet-body { overflow-y: auto; padding: 8px 20px 20px; -webkit-overflow-scrolling: touch; }
label.f { display: block; font-size: 12.5px; font-weight: 600; color: var(--mut); margin: 18px 0 8px; }
.field { width: 100%; height: 50px; padding: 0 16px; border-radius: 15px; background: var(--s2); border: 1px solid var(--line); outline: 0; font-size: 16px; color: var(--tx); transition: border-color .15s; color-scheme: dark; }
.field:focus { border-color: rgba(75,227,165,.55); }
textarea.field { height: auto; padding: 12px 16px; resize: none; }
.amount { display: flex; align-items: baseline; gap: 6px; justify-content: center; padding: 14px 0 4px; }
.amount span { font-size: 28px; color: var(--mut); font-weight: 600; }
.amount input { width: 60%; max-width: 240px; background: none; border: 0; outline: 0; font-size: 48px; font-weight: 700; letter-spacing: -.03em; color: var(--tx); text-align: left; font-variant-numeric: tabular-nums; }
.amount input::placeholder { color: var(--s3); }
.btn { width: 100%; height: 52px; border-radius: 16px; font-weight: 650; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, opacity .15s; }
.btn:active { transform: scale(.98); opacity: .85; }
.btn.primary { color: #04140D; background: linear-gradient(135deg, #6BF5B8, #2FDDA0 60%, #22C3E6); }
.btn.ghost { background: var(--s2); border: 1px solid var(--line); }
.btn.danger { background: rgba(255,107,122,.12); color: var(--red); }
.btns { display: flex; gap: 10px; margin-top: 22px; }
.link { color: var(--acc); font-size: 13.5px; font-weight: 600; padding: 6px 0; }
.hint { font-size: 12.5px; color: var(--mut); }
.hint.ok { color: var(--acc); } .hint.bad { color: var(--amber); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow b { display: block; font-weight: 600; font-size: 15px; }
.setrow small { display: block; color: var(--mut); font-size: 12.5px; margin-top: 2px; }
.pill { flex: none; padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 650; background: var(--s3); }
.pill.go { background: var(--acc); color: #04140D; }
.pill.red { color: var(--red); background: rgba(255,107,122,.12); }
.seg.big { display: flex; width: 100%; padding: 4px; border-radius: 14px; background: var(--s2); }
.seg.big button { flex: 1; padding: 11px 0; font-size: 14px; border-radius: 11px; }
.sumline { text-align: center; color: var(--mut); font-size: 13.5px; margin-top: 18px; }
.sumline b { color: var(--tx); }

#toast { position: fixed; left: 16px; right: 16px; top: calc(var(--sat) + 12px); z-index: 80; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border-radius: 16px; background: #232834; border: 1px solid var(--line2); box-shadow: 0 12px 40px rgba(0,0,0,.5); font-size: 14px; font-weight: 550; opacity: 0; transform: translateY(-14px); pointer-events: none; transition: all .25s; }
#toast.show { opacity: 1; transform: none; pointer-events: auto; }
#toast button { color: var(--acc); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<!-- Splash (shown for 1 second) -->
<div id="splash">
  <svg viewBox="0 0 1024 1024" aria-hidden="true">
    <defs>
      <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151A23"/><stop offset="1" stop-color="#07080B"/></linearGradient>
      <linearGradient id="smint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6BF5B8"/><stop offset=".55" stop-color="#2FDDA0"/><stop offset="1" stop-color="#22C3E6"/></linearGradient>
      <radialGradient id="sglow" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#2FDDA0" stop-opacity=".28"/><stop offset="1" stop-color="#2FDDA0" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1024" height="1024" fill="url(#sbg)"/><rect width="1024" height="1024" fill="url(#sglow)"/>
    <path d="M330 320H700M330 440H700M330 320H500C650 320 650 560 500 560H330L690 800" fill="none" stroke="url(#smint)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="name">Pocket<b>Ledger</b></div>
</div>

<div id="app">
  <header class="top">
    <div class="period">
      <button class="icon" id="prev" aria-label="Previous month"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="plabel" id="plabel"></div>
      <button class="icon" id="next" aria-label="Next month"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="acts">
      <button class="icon" id="btnExport" aria-label="Export"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>
      <button class="icon" id="btnSettings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main id="scroll">
    <section class="hero" id="hero"></section>
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
      <input id="q" type="search" placeholder="Search expenses" autocomplete="off" />
    </label>
    <div class="chips" id="chips"></div>
    <section id="list"></section>
    <div style="height:120px"></div>
  </main>

  <button id="fab" aria-label="Add expense"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- Add / edit expense -->
<div class="sheet-wrap" id="sh-entry" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="entryTitle">New expense</h2><button class="icon" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      <div id="pasteWrap">
        <button class="link" id="togglePaste" type="button">Paste a bank SMS instead</button>
        <div id="pasteBox" hidden>
          <textarea class="field" id="pasteText" rows="3" placeholder="Rs. 450 debited from A/c XX4821 to VPA rapido@axis (UPI Ref 632189401211)"></textarea>
          <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
            <button class="pill go" id="detect" type="button">Detect</button><span class="hint" id="pasteStatus"></span>
          </div>
        </div>
      </div>
      <div class="amount"><span>₹</span><input id="fAmount" inputmode="decimal" placeholder="0" autocomplete="off" /></div>
      <label class="f">Paid to</label>
      <input class="field" id="fMerchant" placeholder="e.g. Swiggy, Rapido" autocomplete="off" />
      <label class="f">Category</label>
      <div class="chips wrap" id="fCats"></div>
      <div id="newCatBox" hidden style="margin-top:10px;display:flex;gap:8px">
        <input class="field" id="newCat" placeholder="New category name" style="height:44px" />
        <button class="pill go" id="newCatAdd" type="button">Add</button>
      </div>
      <label class="f">When</label>
      <input class="field" id="fDate" type="datetime-local" />
      <label class="f">Paid with</label>
      <div class="chips wrap" id="fModes"></div>
      <label class="f">Note <span style="font-weight:400;color:var(--dim)">(optional)</span></label>
      <input class="field" id="fNote" placeholder="Add a note" autocomplete="off" />
      <div class="btns">
        <button class="btn danger" id="fDelete" type="button" hidden style="width:96px">Delete</button>
        <button class="btn primary" id="fSave" type="button">Save expense</button>
      </div>
    </div>
  </div>
</div>

<!-- Export -->
<div class="sheet-wrap" id="sh-export" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Export</h2><button class="icon" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      <label class="f" style="margin-top:6px">Format</label>
      <div class="seg big" id="expFmt"><button data-v="xlsx" class="on">Excel (.xlsx)</button><button data-v="csv">CSV</button></div>
      <label class="f">Range</label>
      <div class="seg big" id="expRange"><button data-v="month" class="on" id="expMonthBtn">This month</button><button data-v="all">All time</button></div>
      <div class="sumline" id="expSum"></div>
      <div class="btns" id="expBtns" style="flex-direction:column"></div>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="sheet-wrap" id="sh-settings" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head"><h2>Settings</h2><button class="icon" data-close aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-body">
      <div class="setrow" id="autoRow" hidden>
        <div><b>Auto-capture</b><small id="autoSmall">Logs debit alerts automatically. Credits are ignored.</small></div>
        <button class="pill" id="autoBtn" type="button">Enable</button>
      </div>
      <div class="setrow"><div><b>Back up data</b><small>Save all expenses as a file</small></div><button class="pill" id="btnBackup" type="button">Back up</button></div>
      <div class="setrow"><div><b>Restore backup</b><small>Merge expenses from a backup file</small></div>
        <label class="pill" style="cursor:pointer">Choose file<input id="restoreInput" type="file" accept=".json,application/json" hidden /></label></div>
      <div class="setrow"><div><b>Delete all data</b><small>Removes every expense from this device</small></div><button class="pill red" id="btnWipe" type="button">Delete</button></div>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="sheet-wrap" id="sh-confirm" aria-hidden="true">
  <div class="backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="cTitle">Are you sure?</h2></div>
    <div class="sheet-body">
      <p class="hint" id="cText" style="font-size:14.5px;margin:4px 0 0"></p>
      <div class="btns"><button class="btn ghost" data-close type="button">Cancel</button><button class="btn danger" id="cOk" type="button" style="background:var(--red);color:#fff">Delete</button></div>
    </div>
  </div>
</div>

<div id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.PLCore;
  var KEY = 'pocketledger_local_expenses_v1', CAT_KEY = 'pocketledger_local_categories_v1';
  var MODES = ['UPI', 'Credit Card', 'Debit Card', 'NetBanking', 'Cash'];
  var PALETTE = { 'Food & Dining': '#FFB347', 'Commute & Fuel': '#4BE3A5', 'Shopping & E-Commerce': '#8B8CFF', 'Groceries': '#A3E635', 'Sports & Recreation': '#38BDF8', 'Bills & Subscriptions': '#FF7AB6', 'Personal Care': '#C084FC', 'Health & Fitness': '#2DD4BF', 'Other': '#94A3B8' };
  var EXTRA = ['#F472B6', '#60A5FA', '#FACC15', '#34D399', '#FB923C', '#A78BFA'];
  var IS_ANDROID = !!window.AndroidBridge;
  var IS_IOS = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.plSave);

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };

  var now0 = new Date();
  var S = { expenses: [], categories: [], y: now0.getFullYear(), m: now0.getMonth() + 1, all: false, cat: 'ALL', q: '',
            editId: null, fCat: 'Other', fMode: 'UPI', catTouched: false, exp: { fmt: 'xlsx', all: false }, undo: null };

  /* ---------------- storage ---------------- */
  function load() {
    var ex = null, ca = null;
    try { ex = JSON.parse(localStorage.getItem(KEY) || 'null'); ca = JSON.parse(localStorage.getItem(CAT_KEY) || 'null'); } catch (e) {}
    if (!ex && window.__PL_SEED) { try { var s = JSON.parse(window.__PL_SEED); ex = s.expenses; ca = s.categories; } catch (e) {} }
    S.expenses = (Array.isArray(ex) ? ex : []).filter(function (e) { return e && e.id && Number(e.amount) > 0; });
    S.categories = Array.isArray(ca) && ca.length ? ca : C.DEFAULT_CATEGORIES.slice();
    S.expenses.forEach(function (e) { if (S.categories.indexOf(e.category) < 0 && e.category) S.categories.push(e.category); });
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S.expenses)); localStorage.setItem(CAT_KEY, JSON.stringify(S.categories)); } catch (e) {}
    try { window.webkit.messageHandlers.plPersist.postMessage(JSON.stringify({ expenses: S.expenses, categories: S.categories })); } catch (e) {}
  }

  /* ---------------- formatting ---------------- */
  function inr(n) {
    n = Number(n) || 0;
    var frac = Math.abs(n * 100 % 100) > 0.5;
    return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 });
  }
  function colorOf(cat) {
    if (PALETTE[cat]) return PALETTE[cat];
    var h = 0; for (var i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
    return EXTRA[h % EXTRA.length];
  }
  function alpha(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function today() { return C.nowLocal().slice(0, 10); }
  function dayLabel(d) {
    if (d === today()) return 'Today';
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (d === C.nowLocal(y).slice(0, 10)) return 'Yesterday';
    var dt = new Date(d + 'T00:00:00');
    return isNaN(dt) ? d : dt.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function timeLabel(s) {
    if (!s || s.length < 16) return '';
    var h = +s.slice(11, 13), ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return h + ':' + s.slice(14, 16) + ' ' + ap;
  }
  function monthName(y, m) { return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); }
  function key(y, m) { return y + '-' + pad(m); }
  function curKey() { return key(S.y, S.m); }
  function prevKey() { return S.m === 1 ? key(S.y - 1, 12) : key(S.y, S.m - 1); }
  function nowKey() { return C.nowLocal().slice(0, 7); }

  /* ---------------- render ---------------- */
  function inPeriod(e) { return S.all || String(e.date).slice(0, 7) === curKey(); }

  function render() {
    $('#plabel').textContent = S.all ? 'All time' : monthName(S.y, S.m);
    $('#prev').disabled = S.all; $('#next').disabled = S.all || curKey() >= nowKey();

    var inP = S.expenses.filter(inPeriod);
    var total = inP.reduce(function (a, e) { return a + Number(e.amount); }, 0);
    var totals = {};
    inP.forEach(function (e) { totals[e.category] = (totals[e.category] || 0) + Number(e.amount); });
    var cats = Object.keys(totals).sort(function (a, b) { return totals[b] - totals[a]; });

    var sub = inP.length + ' expense' + (inP.length === 1 ? '' : 's');
    if (!S.all) {
      var prev = S.expenses.filter(function (e) { return String(e.date).slice(0, 7) === prevKey(); })
        .reduce(function (a, e) { return a + Number(e.amount); }, 0);
      if (prev > 0 && total > 0) {
        var d = Math.round((total - prev) / prev * 100);
        sub = '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '▲ ' : '▼ ') + Math.abs(d) + '%</span> vs last month · ' + sub;
      }
    }
    var bar = cats.map(function (c) { return '<i style="flex:' + totals[c] + ';background:' + colorOf(c) + '"></i>'; }).join('');
    var rows = cats.slice(0, 5).map(function (c) {
      return '<button class="crow' + (S.cat === c ? ' on' : '') + '" data-cat="' + esc(c) + '"><span class="dot" style="background:' + colorOf(c) + '"></span>' +
        '<span class="cn">' + esc(c) + '</span><span class="pc num">' + Math.round(totals[c] / total * 100) + '%</span><span class="ca num">' + inr(totals[c]) + '</span></button>';
    }).join('');
    $('#hero').innerHTML =
      '<div class="hero-top"><span class="eyebrow">Total spent</span><div class="seg" id="scope"><button data-all="0" class="' + (S.all ? '' : 'on') + '">Month</button><button data-all="1" class="' + (S.all ? 'on' : '') + '">All</button></div></div>' +
      '<div class="total num">' + inr(total) + '</div><div class="sub">' + sub + '</div>' +
      (cats.length ? '<div class="bar">' + bar + '</div>' + rows : '');

    // category chips (only categories that have spend in this period, plus the active one)
    var chipCats = cats.slice(); if (S.cat !== 'ALL' && chipCats.indexOf(S.cat) < 0) chipCats.push(S.cat);
    $('#chips').innerHTML = cats.length || S.cat !== 'ALL'
      ? '<button class="chip' + (S.cat === 'ALL' ? ' on' : '') + '" data-cat="ALL">All</button>' +
        chipCats.map(function (c) { return '<button class="chip' + (S.cat === c ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'; }).join('')
      : '';

    // list
    var q = S.q.toLowerCase().trim();
    var list = inP.filter(function (e) {
      if (S.cat !== 'ALL' && e.category !== S.cat) return false;
      if (q && (e.merchant + ' ' + e.category + ' ' + (e.comment || '') + ' ' + (e.refId || '') + ' ' + (e.mode || '')).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });

    if (!list.length) {
      $('#list').innerHTML = '<div class="empty"><div class="big"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></div>' +
        (S.expenses.length ? '<b>Nothing here</b>No expenses match this view.' : '<b>No expenses yet</b>Tap + to add one. Turn on auto-capture in Settings to log debit alerts for you.') + '</div>';
      return;
    }
    var html = '', lastDay = '';
    list.forEach(function (e) {
      var day = String(e.date).slice(0, 10);
      if (day !== lastDay) { html += '<div class="day"><span>' + esc(dayLabel(day)) + '</span></div>'; lastDay = day; }
      var col = colorOf(e.category), t = timeLabel(e.date);
      html += '<button class="row" data-id="' + esc(e.id) + '">' +
        '<span class="av" style="background:' + alpha(col, .16) + ';color:' + col + '">' + esc((e.merchant || '?').trim().charAt(0).toUpperCase() || '?') + '</span>' +
        '<span class="mid"><span class="mn">' + esc(e.merchant) + '</span>' +
        '<span class="ms">' + esc(e.category) + (e.mode ? ' · ' + esc(e.mode) : '') + (t ? ' · ' + t : '') + '</span>' +
        (e.comment ? '<span class="note">' + esc(e.comment) + '</span>' : '') + '</span>' +
        '<span class="rt"><span class="amt num">' + inr(e.amount) + '</span>' + (e.source !== 'Manual' ? '<i class="auto">AUTO</i>' : '') + '</span></button>';
    });
    $('#list').innerHTML = html;
  }

  /* ---------------- sheets & toast ---------------- */
  var stack = [];
  function openSheet(id) { var el = $('#' + id); el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); stack.push(id); }
  function closeSheet(id) {
    var el = $('#' + id); el.classList.remove('open'); el.setAttribute('aria-hidden', 'true');
    stack = stack.filter(function (x) { return x !== id; });
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  var toastTimer;
  function toast(msg, actLabel, act) {
    $('#toastMsg').textContent = msg;
    var b = $('#toastAct'); b.hidden = !actLabel; b.textContent = actLabel || ''; b.onclick = function () { $('#toast').classList.remove('show'); if (act) act(); };
    $('#toast').classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { $('#toast').classList.remove('show'); }, actLabel ? 5000 : 2600);
  }
  function confirmBox(title, text, okLabel, fn) {
    $('#cTitle').textContent = title; $('#cText').textContent = text; $('#cOk').textContent = okLabel;
    $('#cOk').onclick = function () { closeSheet('sh-confirm'); fn(); };
    openSheet('sh-confirm');
  }

  /* ---------------- add / edit ---------------- */
  function renderEntryChips() {
    $('#fCats').innerHTML = S.categories.map(function (c) { return '<button type="button" class="chip' + (S.fCat === c ? ' on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>'; }).join('') +
      '<button type="button" class="chip add" id="chipNew">+ New</button>';
    var modes = MODES.slice(); if (S.fMode && modes.indexOf(S.fMode) < 0) modes.push(S.fMode);
    $('#fModes').innerHTML = modes.map(function (m) { return '<button type="button" class="chip' + (S.fMode === m ? ' on' : '') + '" data-m="' + esc(m) + '">' + esc(m) + '</button>'; }).join('');
  }
  function openEntry(id) {
    var e = id ? S.expenses.filter(function (x) { return x.id === id; })[0] : null;
    S.editId = e ? e.id : null; S.catTouched = !!e;
    $('#entryTitle').textContent = e ? 'Edit expense' : 'New expense';
    $('#pasteWrap').hidden = !!e; $('#pasteBox').hidden = true; $('#pasteText').value = ''; $('#pasteStatus').textContent = '';
    $('#fAmount').value = e ? String(e.amount) : ''; $('#fMerchant').value = e ? e.merchant : '';
    $('#fDate').value = e && String(e.date).length >= 16 ? String(e.date).slice(0, 16) : C.nowLocal();
    $('#fNote').value = e ? (e.comment || '') : '';
    S.fCat = e ? e.category : 'Other'; S.fMode = e ? (e.mode || 'UPI') : 'UPI';
    $('#newCatBox').hidden = true; $('#fDelete').hidden = !e;
    renderEntryChips(); openSheet('sh-entry');
    if (!e) setTimeout(function () { $('#fAmount').focus(); }, 320);
  }
  function saveEntry() {
    var amt = parseFloat(String($('#fAmount').value).replace(/,/g, ''));
    var merchant = $('#fMerchant').value.trim();
    if (!(amt > 0)) { toast('Enter an amount'); return; }
    if (!merchant) { toast('Enter who you paid'); return; }
    var date = $('#fDate').value || C.nowLocal(), note = $('#fNote').value.trim();
    if (S.editId) {
      var e = S.expenses.filter(function (x) { return x.id === S.editId; })[0];
      if (e) { e.amount = amt; e.merchant = merchant; e.category = S.fCat; e.mode = S.fMode; e.date = date; e.comment = note; }
    } else {
      S.expenses.unshift({ id: 'exp-' + Date.now() + Math.floor(Math.random() * 1000), date: date, merchant: merchant, category: S.fCat, amount: amt, mode: S.fMode, source: 'Manual', refId: '', comment: note, rawNotification: S.pasted || '' });
      var k = date.slice(0, 7); if (!S.all && k !== curKey()) { S.y = +k.slice(0, 4); S.m = +k.slice(5, 7); }
    }
    S.pasted = ''; save(); render(); closeSheet('sh-entry'); toast(S.editId ? 'Changes saved' : 'Added ' + inr(amt));
  }

  /* ---------------- auto-capture ---------------- */
  function ingest(text) {
    var p = C.parseMessage(text);
    if (p.kind !== 'debit') return p;                 // credits, OTPs, promos: never logged
    if (C.isDuplicate(S.expenses, p)) return { kind: 'duplicate' };
    S.expenses.unshift({ id: 'exp-' + Date.now() + Math.floor(Math.random() * 1000), date: p.date, merchant: p.merchant, category: p.category, amount: p.amount, mode: p.mode, source: 'Auto', refId: p.refId, comment: '', rawNotification: p.raw });
    save(); render(); toast('Logged ' + inr(p.amount) + ' · ' + p.merchant);
    return p;
  }
  function pull() {
    try {
      if (window.AndroidBridge) JSON.parse(AndroidBridge.drainQueue() || '[]').forEach(function (t) { try { ingest(t); } catch (e) {} });
    } catch (e) {}
    refreshSettings();
  }
  function refreshSettings() {
    if (!IS_ANDROID) return;
    $('#autoRow').hidden = false;
    var on = false; try { on = AndroidBridge.isListenerEnabled(); } catch (e) {}
    $('#autoBtn').textContent = on ? 'On' : 'Enable'; $('#autoBtn').className = 'pill' + (on ? '' : ' go');
    $('#autoSmall').textContent = on ? 'Logging debit alerts automatically. Credits are ignored.' : 'Allow notification access so debit alerts are logged for you.';
  }

  /* ---------------- export ---------------- */
  function exportList() {
    var k = curKey();
    return S.expenses.filter(function (e) { return S.exp.all || String(e.date).slice(0, 7) === k; })
      .map(function (e) { var c = {}; for (var p in e) c[p] = e[p]; c.source = e.source === 'Manual' ? 'Manual' : 'Auto'; return c; });
  }
  function refreshExport() {
    $('#expMonthBtn').textContent = monthName(S.y, S.m);
    $$('#expFmt button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === S.exp.fmt); });
    $$('#expRange button').forEach(function (b) { b.classList.toggle('on', (b.dataset.v === 'all') === S.exp.all); });
    var l = exportList(), tot = l.reduce(function (a, e) { return a + Number(e.amount); }, 0);
    $('#expSum').innerHTML = '<b>' + l.length + '</b> expense' + (l.length === 1 ? '' : 's') + ' · <b>' + inr(tot) + '</b>';
    $('#expBtns').innerHTML = IS_ANDROID
      ? '<button class="btn primary" data-go="save">Save to Downloads</button><button class="btn ghost" data-go="share">Share…</button>'
      : '<button class="btn primary" data-go="save">' + (IS_IOS ? 'Save or share' : 'Download') + '</button>';
  }
  function deliver(name, mime, data, how) {
    var b64 = C.toBase64(data), r = '';
    try {
      if (IS_ANDROID) r = how === 'share' ? AndroidBridge.shareFile(name, mime, b64) : AndroidBridge.saveFile(name, mime, b64);
      else if (IS_IOS) { window.webkit.messageHandlers.plSave.postMessage({ name: name, mime: mime, base64: b64 }); r = 'ok:'; }
      else {
        var blob = new Blob([typeof data === 'string' ? data : data.buffer], { type: mime }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); r = 'ok:';
      }
    } catch (e) { r = 'err:' + e.message; }
    if (String(r).indexOf('err') === 0) toast('Could not save the file');
    else if (r === 'shared') toast('Choose where to send it');
    else if (String(r).indexOf('ok:') === 0 && r.length > 3) toast('Saved to ' + r.slice(3));
    return r;
  }
  function doExport(how) {
    var l = exportList();
    if (!l.length) { toast('Nothing to export for this range'); return; }
    var base = 'PocketLedger_' + (S.exp.all ? 'All_' + today() : curKey());
    if (S.exp.fmt === 'xlsx') deliver(base + '.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', C.buildXlsx(l), how);
    else deliver(base + '.csv', 'text/csv', C.buildCsv(l), how);
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target, el;
    if ((el = t.closest('[data-close]'))) { var w = el.closest('.sheet-wrap'); if (w) closeSheet(w.id); return; }
    if ((el = t.closest('#scope button'))) { S.all = el.dataset.all === '1'; S.cat = 'ALL'; render(); return; }
    if ((el = t.closest('.crow, #chips .chip'))) { var c = el.dataset.cat; S.cat = (S.cat === c || c === 'ALL') ? 'ALL' : c; render(); return; }
    if ((el = t.closest('.row'))) { openEntry(el.dataset.id); return; }
    if ((el = t.closest('#fCats .chip[data-c]'))) { S.fCat = el.dataset.c; S.catTouched = true; renderEntryChips(); return; }
    if (t.closest('#chipNew')) { $('#newCatBox').hidden = false; $('#newCat').focus(); return; }
    if ((el = t.closest('#fModes .chip'))) { S.fMode = el.dataset.m; renderEntryChips(); return; }
    if ((el = t.closest('#expFmt button'))) { S.exp.fmt = el.dataset.v; refreshExport(); return; }
    if ((el = t.closest('#expRange button'))) { S.exp.all = el.dataset.v === 'all'; refreshExport(); return; }
    if ((el = t.closest('#expBtns [data-go]'))) { doExport(el.dataset.go); return; }
  });
  $('#prev').onclick = function () { if (S.m === 1) { S.m = 12; S.y--; } else S.m--; S.cat = 'ALL'; render(); };
  $('#next').onclick = function () { if (S.m === 12) { S.m = 1; S.y++; } else S.m++; S.cat = 'ALL'; render(); };
  $('#fab').onclick = function () { openEntry(null); };
  $('#btnExport').onclick = function () { S.exp.all = S.all; refreshExport(); openSheet('sh-export'); };
  $('#btnSettings').onclick = function () { refreshSettings(); openSheet('sh-settings'); };
  $('#q').addEventListener('input', function (e) { S.q = e.target.value; render(); });
  $('#fSave').onclick = saveEntry;
  $('#fDelete').onclick = function () {
    var i = S.expenses.map(function (x) { return x.id; }).indexOf(S.editId); if (i < 0) return;
    var gone = S.expenses.splice(i, 1)[0]; save(); render(); closeSheet('sh-entry');
    toast('Expense deleted', 'Undo', function () { S.expenses.splice(Math.min(i, S.expenses.length), 0, gone); save(); render(); });
  };
  $('#fMerchant').addEventListener('input', function (e) {
    if (S.catTouched) return;
    var c = C.inferCategory(e.target.value);
    if (c !== S.fCat && (c !== 'Other' || !e.target.value)) { S.fCat = c; renderEntryChips(); }
  });
  $('#newCatAdd').onclick = function () {
    var v = $('#newCat').value.trim(); if (!v) return;
    if (S.categories.indexOf(v) < 0) S.categories.push(v);
    S.fCat = v; S.catTouched = true; $('#newCat').value = ''; $('#newCatBox').hidden = true; save(); renderEntryChips();
  };
  $('#togglePaste').onclick = function () { var b = $('#pasteBox'); b.hidden = !b.hidden; if (!b.hidden) $('#pasteText').focus(); };
  $('#detect').onclick = function () {
    var p = C.parseMessage($('#pasteText').value), st = $('#pasteStatus');
    if (p.kind !== 'debit') { st.className = 'hint bad'; st.textContent = p.reason; return; }
    $('#fAmount').value = p.amount; $('#fMerchant').value = p.merchant; S.fCat = p.category; S.fMode = p.mode; S.catTouched = true; S.pasted = p.raw;
    if (S.categories.indexOf(p.category) < 0) S.categories.push(p.category);
    renderEntryChips(); st.className = 'hint ok'; st.textContent = 'Found ' + inr(p.amount) + ' · ' + p.merchant;
  };
  $('#autoBtn').onclick = function () { try { AndroidBridge.openNotificationAccess(); } catch (e) {} };
  $('#btnBackup').onclick = function () {
    deliver('PocketLedger_backup_' + today() + '.json', 'application/json', JSON.stringify({ app: 'PocketLedger', expenses: S.expenses, categories: S.categories }, null, 2), 'save');
  };
  $('#restoreInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result); if (!Array.isArray(d.expenses)) throw 0;
        var have = {}; S.expenses.forEach(function (x) { have[x.id] = 1; }); var added = 0;
        d.expenses.forEach(function (x) { if (x && x.id && Number(x.amount) > 0 && !have[x.id]) { S.expenses.push(x); added++; if (S.categories.indexOf(x.category) < 0 && x.category) S.categories.push(x.category); } });
        save(); render(); closeSheet('sh-settings'); toast('Restored ' + added + ' expense' + (added === 1 ? '' : 's'));
      } catch (err) { toast('That is not a PocketLedger backup'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });
  $('#btnWipe').onclick = function () {
    confirmBox('Delete all data?', 'Every expense on this device will be removed. Back up first if you might need them.', 'Delete everything', function () {
      S.expenses = []; S.categories = C.DEFAULT_CATEGORIES.slice(); S.cat = 'ALL'; save(); render(); closeSheet('sh-settings'); toast('All data deleted');
    });
  };
  document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });

  /* ---------------- public API used by the Android / iOS wrappers ---------------- */
  window.PL = {
    pull: pull,
    ingest: ingest,
    ingestMany: function (arr) { (arr || []).forEach(function (t) { try { ingest(t); } catch (e) {} }); },
    back: function () { if (!stack.length) return false; closeSheet(stack[stack.length - 1]); return true; }
  };

  /* ---------------- boot ---------------- */
  load(); render(); pull();
  setTimeout(function () {
    var s = $('#splash'); s.classList.add('hide');
    setTimeout(function () { s.style.display = 'none'; }, 400);
  }, 1000);
})();
</script>
</body>
</html>
