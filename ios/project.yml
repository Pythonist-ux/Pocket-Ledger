# XcodeGen spec - generates PocketLedger.xcodeproj so there is no hand-maintained .xcodeproj.
#   brew install xcodegen && cd ios && xcodegen generate && open PocketLedger.xcodeproj
name: PocketLedger
options:
  bundleIdPrefix: com.pocketledger
  deploymentTarget:
    iOS: "16.0"
targets:
  PocketLedger:
    type: application
    platform: iOS
    sources:
      - path: PocketLedgerApp.swift
      - path: index.html
        buildPhase: resources
      - path: core.js
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketledger.local
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: PocketLedger
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.pocketledger.local
            CFBundleURLSchemes:
              - pocketledger
